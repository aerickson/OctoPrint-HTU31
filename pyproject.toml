[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-HTU31"
version = "0.2.0"
description = "Reads HTU31 sensors and adds the data to OctoPrint's temperature data."
readme = {file = "README.md", content-type = "markdown"}
requires-python = ">=3.7, <4"
dynamic = ["license"]
authors = [
    {name = "Andrew J. Erickson", email = "aerickson@gmail.com"}
]
dependencies = [
	"adafruit-blinka>=6.13.0", 
    "adafruit-circuitpython-htu31d>=1.1.19",
    "adafruit-platformdetect>=3.15.3",
    "lgpio>=0.2.2.0",
    "pexpect>=4.8.0",
    "rpi-gpio>=0.7.1",
]
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_HTU31",
    "octoprint_HTU31.*"
]

[project.entry-points."octoprint.plugin"]
HTU31 = "octoprint_HTU31"

[project.urls]
Homepage = "https://github.com/aerickson/OctoPrint-HTU31"